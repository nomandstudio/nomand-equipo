<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo — Nomand Studio</title>
<link rel="stylesheet" href="https://use.typekit.net/dac6yfv.css">
<style>
:root {
  --orange: #F39200;
  --orange-10: rgba(243,146,0,0.10);
  --orange-20: rgba(243,146,0,0.22);
  --bg: #111111;
  --card: rgba(255,255,255,0.06);
  --card-border: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.92);
  --text2: rgba(255,255,255,0.5);
  --text3: rgba(255,255,255,0.28);
  --green: #34c759;
  --green-10: rgba(52,199,89,0.12);
  --red: #ff453a;
  --red-10: rgba(255,69,58,0.12);
  --blue: #0a84ff;
  --blue-10: rgba(10,132,255,0.12);
  --shadow: 0 2px 16px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.25);
  --blur: blur(24px) saturate(1.6);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'century-gothic','Century Gothic',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 15% 15%, rgba(243,146,0,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 85%, rgba(243,146,0,0.04) 0%, transparent 50%);
}

/* LOGIN */
#login-screen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: var(--bg);
  position:relative;
  overflow:hidden;
}
#login-screen::before {
  content:'';
  position:absolute;
  width:600px;height:600px;
  top:-150px;right:-150px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(243,146,0,0.08) 0%,transparent 65%);
  pointer-events:none;
}
#login-screen::after {
  content:'';
  position:absolute;
  width:400px;height:400px;
  bottom:-100px;left:-100px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(243,146,0,0.05) 0%,transparent 65%);
  pointer-events:none;
}

.login-card {
  width:100%;max-width:400px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius:28px;
  padding:44px 40px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-lg), inset 0 1px 1px rgba(255,255,255,0.08);
  position:relative;z-index:1;
}
.l-logo { display:flex;align-items:center;gap:9px;margin-bottom:32px; }
.l-logo img { width:26px;height:26px;object-fit:contain; }
.l-logo span { font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text); }
.l-badge { display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:var(--orange-10);border:1px solid var(--orange-20);border-radius:100px;font-size:10px;font-weight:700;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:16px; }
.l-title { font-size:24px;font-weight:300;color:var(--text);margin-bottom:4px; }
.l-sub { font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.5; }
.f-group { margin-bottom:14px; }
.f-group label { display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:6px; }
.f-group input { width:100%;padding:12px 15px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:11px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s; }
.f-group input:focus { border-color:var(--orange);box-shadow:0 0 0 3px rgba(243,146,0,0.15);background:rgba(255,255,255,0.08); }
.f-group input::placeholder { color:var(--text3); }
.remember { display:flex;align-items:center;gap:7px;margin-bottom:18px;margin-top:2px; }
.remember input { accent-color:var(--orange); }
.remember label { font-size:12px;color:var(--text2);cursor:pointer; }
.btn-main { width:100%;padding:13px;background:var(--orange);border:none;border-radius:100px;font-family:inherit;font-size:14px;font-weight:700;color:#fff;cursor:pointer;transition:opacity 0.2s,transform 0.15s;box-shadow:0 4px 20px rgba(243,146,0,0.35); }
.btn-main:hover { opacity:0.92;transform:translateY(-1px); }
.btn-main:disabled { opacity:0.6;cursor:not-allowed;transform:none; }
.l-err { font-size:12px;color:var(--red);text-align:center;margin-top:10px;display:none; }
.l-help { font-size:11px;color:var(--text3);text-align:center;margin-top:16px;line-height:1.6; }

/* TOPBAR */
#app-screen { display:none; }
.topbar {
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:56px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom:1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.05);
}
.tb-left { display:flex;align-items:center;gap:16px; }
.tb-logo { display:flex;align-items:center;gap:8px; }
.tb-logo img { width:20px;height:20px;object-fit:contain; }
.tb-logo span { font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text); }
.tb-badge { padding:3px 10px;background:var(--orange-10);border:1px solid var(--orange-20);border-radius:100px;font-size:10px;font-weight:700;color:var(--orange);letter-spacing:0.06em;text-transform:uppercase; }
.tb-right { display:flex;align-items:center;gap:10px; }
.tb-user { display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:100px;backdrop-filter:blur(8px); }
.tb-av { width:26px;height:26px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;box-shadow:0 2px 6px rgba(243,146,0,0.3); }
.tb-uname { font-size:12px;font-weight:700;color:var(--text); }
.tb-role { font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase; }
.btn-sm { padding:6px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;transition:background 0.15s;backdrop-filter:blur(8px); }
.btn-sm:hover { background:rgba(255,255,255,0.12);color:var(--text); }

/* LAYOUT */
.app-layout { display:flex;min-height:calc(100vh - 56px); }

/* SIDEBAR */
.sidebar {
  width:220px;flex-shrink:0;
  background: rgba(255,255,255,0.03);
  border-right:1px solid rgba(255,255,255,0.07);
  padding:20px 12px;
  display:flex;flex-direction:column;gap:2px;
  position:sticky;top:56px;height:calc(100vh - 56px);
  overflow-y:auto;
  backdrop-filter: blur(20px);
}
.sb-section { font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);font-weight:700;padding:8px 12px 4px;margin-top:8px; }
.sb-btn { display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;width:100%;text-align:left;transition:all 0.15s; }
.sb-btn:hover { background:rgba(255,255,255,0.06);color:var(--text); }
.sb-btn.active { background:rgba(243,146,0,0.12);color:var(--orange);font-weight:700;border:1px solid rgba(243,146,0,0.18); }
.sb-ico { font-size:15px;width:20px;text-align:center;opacity:0.7; }
.sb-btn.active .sb-ico { opacity:1; }

/* MAIN */
.main { flex:1;padding:32px 40px 64px;overflow-x:hidden; }

/* PAGE HEADER */
.ph { margin-bottom:28px; }
.ph-label { font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:5px; }
.ph-title { font-size:28px;font-weight:300;color:var(--text); }
.ph-row { display:flex;align-items:center;justify-content:space-between; }

/* WELCOME CARD */
.welcome {
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;padding:26px 30px;margin-bottom:24px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow), inset 0 1px 1px rgba(255,255,255,0.06);
}
.w-date { font-size:11px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px; }
.w-title { font-size:21px;font-weight:300;color:var(--text);margin-bottom:3px; }
.w-sub { font-size:13px;color:var(--text2); }
.w-badge { display:flex;align-items:center;gap:7px;padding:8px 16px;background:var(--orange-10);border:1px solid var(--orange-20);border-radius:100px;font-size:12px;color:var(--orange);font-weight:700;white-space:nowrap; }

/* GRID */
.grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px; }
.grid-3 { display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px; }
.grid-4 { display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px; }

/* CARD */
.card { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:box-shadow 0.2s,transform 0.2s;box-shadow:var(--shadow),inset 0 1px 1px rgba(255,255,255,0.06); }
.card.clickable:hover { box-shadow:var(--shadow-lg),inset 0 1px 1px rgba(255,255,255,0.06);transform:translateY(-2px);cursor:pointer; }
.card-tag { font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:5px; }
.card-title { font-size:17px;font-weight:400;color:var(--text);margin-bottom:8px; }
.card-body { font-size:13px;color:var(--text2);line-height:1.6; }
.stat-num { font-size:32px;font-weight:700;color:var(--text);margin-bottom:4px; }
.stat-label { font-size:12px;color:var(--text2); }

/* BADGE */
.badge { display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700; }
.b-orange { background:var(--orange-10);color:var(--orange); }
.b-green { background:var(--green-10);color:var(--green); }
.b-red { background:var(--red-10);color:var(--red); }
.b-blue { background:var(--blue-10);color:var(--blue); }
.b-gray { background:rgba(0,0,0,0.06);color:var(--text2); }

/* TABLE */
.table-wrap { background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:var(--blur); }
.table-head { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.07); }
.table-title { font-size:13px;font-weight:700;letter-spacing:0.04em;color:var(--text); }
table { width:100%;border-collapse:collapse; }
th { padding:10px 20px;text-align:left;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);font-weight:700;border-bottom:1px solid rgba(255,255,255,0.07); }
td { padding:13px 20px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(255,255,255,0.04); }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(255,255,255,0.03); }
.td-btn { padding:5px 12px;border:0.5px solid rgba(255,255,255,0.12);border-radius:8px;background:none;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s; }
.td-btn:hover { background:var(--orange-10);border-color:var(--orange-20);color:var(--orange); }

/* PROGRESS */
.prog { margin-top:10px; }
.prog-row { display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px; }
.prog-track { height:4px;background:rgba(255,255,255,0.08);border-radius:100px;overflow:hidden; }
.prog-fill { height:100%;background:var(--orange);border-radius:100px;transition:width 1s ease; }

/* FORM */
.form-card { background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:28px;box-shadow:var(--shadow);backdrop-filter:var(--blur); }
.form-title { font-size:16px;font-weight:700;color:var(--text);margin-bottom:20px; }
.form-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
.form-full { grid-column:1/-1; }
.fg { display:flex;flex-direction:column;gap:5px; }
.fg label { font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);font-weight:700; }
.fg input,.fg select,.fg textarea {
  padding:10px 13px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:9px;
  font-family:inherit;font-size:13px;color:var(--text);
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus { border-color:var(--orange);box-shadow:0 0 0 3px rgba(243,146,0,0.12);background:rgba(255,255,255,0.08); }
.fg input::placeholder,.fg textarea::placeholder { color:var(--text3); }
.fg textarea { resize:vertical;min-height:80px; }
.fg select { cursor:pointer;color-scheme:dark; }
.form-actions { display:flex;gap:10px;margin-top:20px;justify-content:flex-end; }
.btn-cancel { padding:10px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.15s; }
.btn-cancel:hover { background:rgba(255,255,255,0.09);color:var(--text); }
.btn-save { padding:10px 24px;background:var(--orange);border:none;border-radius:100px;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 3px 12px rgba(243,146,0,0.3);transition:opacity 0.2s; }
.btn-save:hover { opacity:0.9; }
.btn-save:disabled { opacity:0.6;cursor:not-allowed; }

/* CLIENT DETAIL */
.client-header { display:flex;align-items:center;gap:16px;margin-bottom:24px; }
.client-av { width:52px;height:52px;border-radius:14px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;text-transform:uppercase;flex-shrink:0; }
.client-name { font-size:22px;font-weight:400;color:var(--text);margin-bottom:4px; }
.client-empresa { font-size:13px;color:var(--text2); }
.back-btn { display:flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;margin-bottom:20px;transition:all 0.15s; }
.back-btn:hover { background:rgba(255,255,255,0.1);color:var(--text); }

/* TABS */
.tabs { display:flex;gap:4px;background:rgba(255,255,255,0.05);padding:4px;border-radius:11px;width:fit-content;margin-bottom:20px; }
.tab { padding:7px 16px;border-radius:8px;border:none;background:none;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s;font-weight:600; }
.tab.active { background:rgba(255,255,255,0.1);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.12); }

/* FILES */
.file-row { display:flex;align-items:center;gap:11px;padding:11px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;margin-bottom:5px;transition:all 0.15s; }
.file-row:hover { background:rgba(255,255,255,0.07);border-color:rgba(243,146,0,0.2); }
.f-ico { width:32px;height:32px;border-radius:8px;background:var(--orange-10);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0; }
.f-name { font-size:13px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.f-date { font-size:11px;color:var(--text3);flex-shrink:0; }
.f-actions { display:flex;gap:6px;flex-shrink:0; }
.f-pub { padding:5px 12px;background:var(--orange-10);border:1px solid var(--orange-20);border-radius:100px;font-size:11px;font-weight:700;color:var(--orange);cursor:pointer;transition:all 0.15s; }
.f-pub:hover { background:var(--orange);color:#fff; }
.f-del { padding:5px 10px;background:var(--red-10);border:1px solid rgba(255,69,58,0.2);border-radius:100px;font-size:11px;font-weight:700;color:var(--red);cursor:pointer; }

/* ROLE BADGE */
.role-owner { background:rgba(255,159,10,0.12);color:#ff9f0a; }
.role-designer { background:var(--blue-10);color:var(--blue); }
.role-collab { background:rgba(255,255,255,0.06);color:var(--text2); }

/* EMPTY + SPINNER */
.empty { text-align:center;padding:48px 20px;color:var(--text3); }
.empty-ico { font-size:36px;margin-bottom:10px;opacity:0.35; }
.empty-txt { font-size:14px;line-height:1.6; }
.spin-wrap { display:flex;align-items:center;justify-content:center;padding:48px;gap:8px;color:var(--text3);font-size:13px; }
.spinner { width:16px;height:16px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--orange);border-radius:50%;animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* MODAL */
.modal { display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center; }
.modal.active { display:flex; }
.modal-ov { position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px); }
.modal-box { position:relative;z-index:1;width:100%;max-width:560px;margin:20px;background:rgba(30,30,30,0.85);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg);backdrop-filter:var(--blur);animation:mIn 0.2s ease; }
@keyframes mIn { from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)} }
.modal-title { font-size:18px;font-weight:700;color:var(--text);margin-bottom:20px; }
.modal-close { position:absolute;top:16px;right:16px;background:none;border:none;font-size:18px;color:var(--text3);cursor:pointer; }

/* DROPDOWN MENU */
.dropdown-menu {
  display:none;
  position:fixed;
  background:#fff;
  border:1px solid rgba(0,0,0,0.1);
  border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12);
  z-index:9999;
  min-width:170px;
  overflow:hidden;
}
.dropdown-menu.active { display:block; }
.dropdown-item {
  display:block;width:100%;
  padding:10px 16px;
  background:none;border:none;
  font-family:inherit;font-size:13px;
  color:var(--text);cursor:pointer;
  text-align:left;
  transition:background 0.1s;
}
.dropdown-item:hover { background:rgba(0,0,0,0.04); }
.dropdown-item.danger { color:var(--red); border-top:1px solid rgba(0,0,0,0.06); }
.notif { position:fixed;bottom:24px;right:24px;z-index:9998;display:flex;flex-direction:column;gap:8px; }
.notif-item { padding:12px 18px;background:var(--text);border-radius:12px;font-size:13px;color:#fff;box-shadow:var(--shadow-lg);animation:notifIn 0.3s ease; }
.notif-item.success { background:#1c1c1e; }
@keyframes notifIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }

@media(max-width:768px){
  .topbar{padding:0 16px;}
  .sidebar{display:none;}
  .main{padding:20px 16px 48px;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .welcome{flex-direction:column;gap:14px;align-items:flex-start;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="l-logo">
      <img src="https://cdn.prod.website-files.com/6a0284e59b4361db568fb80e/6a0417eda0998bb179d2f25c_Logo-pagina.png" alt="N" onerror="this.style.display='none'">
      <span>Nomand Studio</span>
    </div>
    <div class="l-badge">🏔 Panel de equipo</div>
    <div class="l-title">Bienvenido de vuelta</div>
    <div class="l-sub">Accede con tus credenciales de Nomand.</div>
    <div class="f-group"><label>Correo</label><input type="email" id="lemail" placeholder="correo@ejemplo.com" autocomplete="email"></div>
    <div class="f-group"><label>Contraseña</label><input type="password" id="lpass" placeholder="••••••••" autocomplete="current-password"></div>

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="spin-wrap"><div class="spinner"></div> Cargando...</div>';

  if (section === 'inicio') renderInicio();
  else if (section === 'clientes') renderClientes();

async function crearCliente() {
  const nombre = document.getElementById('nc-nombre').value.trim();
  const empresa = document.getElementById('nc-empresa').value.trim();
  const correo = document.getElementById('nc-correo').value.trim();
  const tel = document.getElementById('nc-tel')?.value.trim();
  const proyecto = document.getElementById('nc-proyecto')?.value.trim();
  const paquete = document.getElementById('nc-paquete')?.value;
  const total = parseFloat(document.getElementById('nc-total')?.value||0);
  const pagado = parseFloat(document.getElementById('nc-pagado')?.value||0);
  const fecha = document.getElementById('nc-fecha')?.value;
  const desc = document.getElementById('nc-desc')?.value.trim();

  const servicios = Array.from(document.querySelectorAll('#servicios-check input:checked')).map(i=>i.value);

  if (!nombre||!empresa||!correo) { notify('Nombre, empresa y correo son obligatorios.','error'); return; }

  const btn = document.getElementById('btn-crear-cliente');
  const status = document.getElementById('nc-status');
  btn.disabled = true; btn.textContent = 'Creando...';
  status.textContent = 'Creando usuario en Supabase...';

  try {
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3V1t3njMEoQ9gmYWUMYh3UeMqVRHZx4xe8l90arAL7uuH_cmiRinFmfX2Q_rii7hT/exec';

    status.textContent = 'Creando acceso del cliente...';

    // Crear usuario en Supabase con rol:cliente
    const SVC = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvd2R1dHp5cnNmbmNud2VqcGJ0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTEyMzY4MywiZXhwIjoyMDk0Njk5NjgzfQ.RQqdd0AqeJBVt3gRDMiZN-20ND1MvJSYbt83nUiH7IQ';
    const invRes = await fetch(SB + '/auth/v1/admin/invite', {
      method: 'POST',
      headers: { 'apikey': SVC, 'Authorization': 'Bearer ' + SVC, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: correo, data: { nombre }, app_metadata: { rol: 'cliente' } })
    });
    const invData = await invRes.json();

    status.textContent = 'Creando carpetas en Drive y enviando correo...';

    // Apps Script: carpetas + correo bienvenida desde colaborador.nomand@gmail.com
    await callAppsScript(SCRIPT_URL, {
      action: 'createClientComplete',
      clientName: empresa,
      folders: servicios,
      email: correo,
      nombre: nombre,
      sendWelcome: true
    });

    status.textContent = 'Guardando en base de datos...';

    // Create cliente record in Supabase (without user_id for now, will link when they accept invite)
    const clienteRes = await api('/rest/v1/clientes', {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ nombre, empresa, correo, telefono: tel, estado: 'Activo', carpeta_creada: false })
    });
    const cliente = Array.isArray(clienteRes) ? clienteRes[0] : clienteRes;

    // Create project if data provided
    if (proyecto && cliente?.id) {
      await api('/rest/v1/proyectos', {
        method: 'POST',
        body: JSON.stringify({
          cliente_id: cliente.id,
          nombre: proyecto,
          paquete,
          estado: 'En proceso',
          total_a_cobrar: total||0,
          pagado: pagado||0,
          fecha_entrega: fecha||null,
          descripcion: desc||null
        })
      });
    }

    status.textContent = '✅ Cliente creado. Carpetas en Drive listas y correo de acceso enviado.';
    notify('✅ Cliente ' + nombre + ' creado exitosamente.');
    setTimeout(() => goTo('clientes'), 2000);

  } catch(e) {
    notify('Error al crear cliente. Intenta de nuevo.');
    btn.disabled = false; btn.textContent = 'Crear cliente y enviar acceso';
    status.textContent = 'Error: ' + e.message;
  }
}

async function crearCarpetasDrive(empresa, servicios) {
  // Carpetas base siempre
  const carpetasBase = ['Brief', 'Contrato', 'Cronograma', 'Entregables', 'Solicitados'];
  // Carpetas adicionales según servicios
  const carpetasExtra = [];
  if (servicios.includes('Fotografía')) carpetasExtra.push('Fotografía');
  if (servicios.includes('Video')) carpetasExtra.push('Video');
  if (servicios.includes('Identidad de marca')||servicios.includes('Branding')) carpetasExtra.push('Identidad');

  const todasCarpetas = [...new Set([...carpetasBase, ...carpetasExtra])];

  // Call Google Apps Script to create folders
  try {
    await fetch('https://script.google.com/macros/s/AKfycbx3V1t3njMEoQ9gmYWUMYh3UeMqVRHZx4xe8l90arAL7uuH_cmiRinFmfX2Q_rii7hT/exec', {
      method: 'POST',
      body: JSON.stringify({ action: 'createClientFolders', clientName: empresa, folders: todasCarpetas }),
      mode: 'no-cors'
    });
  } catch(e) {
    console.log('Drive folders: manual creation needed');
  }
}

function renderArchivosTab(archivos, publicados) {
  if (!archivos.length) return '<div class="empty"><div class="empty-ico">📁</div><div class="empty-txt">' + (publicados ? 'Sin archivos publicados.' : 'Sin archivos internos.') + '</div></div>';

  const tipos = ['Brief','Contrato','Cronograma','Entregables','Solicitados'];
  const grouped = {};
  archivos.forEach(a => {
    const t = a.tipo||'Entregables';
    if(!grouped[t]) grouped[t]=[];
    grouped[t].push(a);
  });

  const icos = {Brief:'📄',Contrato:'📋',Cronograma:'📅',Entregables:'🏔',Solicitados:'📎'};

  return tipos.filter(t=>grouped[t]).map(tipo=>`
    <div style="margin-bottom:20px">
      <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:8px">${icos[tipo]||'📁'} ${tipo}</div>
      ${grouped[tipo].map(f=>`
        <div class="file-row">
          <div class="f-ico">${fIco(f.nombre)}</div>
          <span class="f-name">${f.nombre}</span>
          <span class="f-date">${f.fecha?new Date(f.fecha).toLocaleDateString('es-MX',{day:'numeric',month:'short'}):''}</span>
          <div class="f-actions">
            <a href="${f.link_drive}" target="_blank" class="f-pub" style="text-decoration:none">Ver</a>
            ${!publicados ? `<button class="f-pub" onclick="publicarArchivo('${f.id}')">Publicar →</button>` : ''}
          </div>
        </div>`).join('')}
    </div>`).join('');
}

let currentClienteId = null;
let currentClienteData = null;
let upFiles = [];

function onDragOver(e) {
  e.preventDefault();
  const zone = document.getElementById('drop-zone');
  if (zone) { zone.style.borderColor = 'var(--orange)'; zone.style.background = 'var(--orange-10)'; }
}

function onDragLeave(e) {
  const zone = document.getElementById('drop-zone');
  if (zone) { zone.style.borderColor = 'rgba(0,0,0,0.12)'; zone.style.background = ''; }
}

function onDrop(e) {
  e.preventDefault();
  onDragLeave(e);
  upFiles = Array.from(e.dataTransfer.files);
  showUpFiles();
}

function onUpFiles(inp) {
  upFiles = Array.from(inp.files);
  showUpFiles();
}

function showUpFiles() {
  const el = document.getElementById('up-list');
  if (!el) return;
  el.innerHTML = upFiles.map(f=>
    `<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:7px 10px;background:rgba(0,0,0,0.03);border-radius:8px;margin-bottom:4px">
      ${fIco(f.name)} <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
      <span style="color:var(--text3);flex-shrink:0">${(f.size/1024).toFixed(0)}KB</span>
    </div>`
  ).join('');
}

async function subirArchivos(publicar) {
  if (!upFiles.length) { notify('Selecciona archivos primero.'); return; }
  const tipo = document.getElementById('up-tipo')?.value || 'Entregables';
  const carpeta = document.getElementById('up-carpeta')?.value || '';
  const status = document.getElementById('up-status');
  status.textContent = 'Registrando archivos...';

  const today = new Date().toISOString().split('T')[0];

  for (const file of upFiles) {
    await api('/rest/v1/archivos', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        cliente_id: currentClienteId,
        nombre: file.name,
        tipo,
        carpeta,
        fecha: today,
        publicado: publicar,
        link_drive: ''
      })
    });
  }

  status.textContent = publicar
    ? '✅ Archivos publicados. El cliente ya puede verlos.'
    : '✅ Archivos guardados como internos. Recuerda subirlos a Drive.';

  notify(publicar ? '✅ Archivos publicados al cliente.' : '✅ Archivos guardados como internos.');
  upFiles = [];
  const upList = document.getElementById('up-list');
  if (upList) upList.innerHTML = '';
  const upFile = document.getElementById('up-file');
  if (upFile) upFile.value = '';

  // Refresh current tab
  setTimeout(() => {
    const activeTab = document.querySelector('.tab.active');
    if (activeTab) switchTab(publicar ? 'publicados' : 'internos', activeTab);
  }, 500);
}

async function crearCarpetaEnDrive() {
  if (!currentClienteData) return;
  const tipo = document.getElementById('cf-tipo')?.value;
  const nombre = document.getElementById('cf-nombre')?.value.trim();
  const sub = document.getElementById('cf-sub')?.value.trim();
  const status = document.getElementById('cf-status');

  if (!nombre) { notify('Escribe el nombre de la carpeta.'); return; }
  status.textContent = 'Creando en Drive...';

  const ruta = sub ? nombre + ' / ' + sub : nombre;

  // Send to Apps Script
  await fetch('https://script.google.com/macros/s/AKfycbx3V1t3njMEoQ9gmYWUMYh3UeMqVRHZx4xe8l90arAL7uuH_cmiRinFmfX2Q_rii7hT/exec', {
    method: 'POST',
    body: JSON.stringify({
      action: 'createSubfolder',
      clientName: currentClienteData.empresa,
      tipo,
      folderName: nombre,
      subfolder: sub || ''
    }),
    mode: 'no-cors'
  });

  status.textContent = '✅ Carpeta "' + ruta + '" creada en Drive (puede tardar unos segundos).';
  notify('✅ Carpeta ' + ruta + ' creada.');
  document.getElementById('cf-nombre').value = '';
  document.getElementById('cf-sub').value = '';
}

async function publicarArchivo(archivoId) {
  await api('/rest/v1/archivos?id=eq.' + archivoId, {
    method: 'PATCH',
    body: JSON.stringify({ publicado: true })
  });
  notify('✅ Archivo publicado al cliente.');
  // Refresh
  const activeTab = document.querySelector('.tab.active');
  if (activeTab) switchTab('internos', document.querySelector('.tab'));
}

async function actualizarPago(proyId) {
  const total = parseFloat(document.getElementById('mp-total').value||0);

  await api('/rest/v1/proyectos?id=eq.' + proyId, {
    method: 'PATCH',
    body: JSON.stringify({ total_a_cobrar: total, pagado })
  });
  document.getElementById('modal-pago').classList.remove('active');
  notify('✅ Pago actualizado.');
}

async function crearMiembro() {
  const nombre = document.getElementById('nm-nombre').value.trim();
  const correo = document.getElementById('nm-correo').value.trim();
  const rol = document.getElementById('nm-rol').value;
  if (!nombre||!correo) { notify('Nombre y correo obligatorios.'); return; }

  document.getElementById('nm-status').textContent = 'Creando...';

  const s = gs();
  await fetch(SB + '/auth/v1/admin/invite', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: correo })
  });

  await api('/rest/v1/equipo', {
    method: 'POST',

  });

  document.getElementById('modal-miembro').classList.remove('active');

function updateCotizPreview() {
  cotizSeleccion.clienteNombre = document.getElementById('cq-cliente')?.value||'';
  cotizSeleccion.proyectoNombre = document.getElementById('cq-proyecto')?.value||'';
  let items = [], subtotal = 0;
  if (cotizSeleccion.tipo==='paquete' && cotizSeleccion.paqueteId) {
    const pkg = PAQUETES.find(p=>p.id===cotizSeleccion.paqueteId);
    if (pkg) { items = pkg.servicios.map(sid=>{ const s=SERVICIOS_CATALOG.find(x=>x.id===sid); return s?{nombre:s.nombre,precio:0}:null; }).filter(Boolean); subtotal=pkg.precio_paquete; }
  } else {
    document.querySelectorAll('#cotiz-individuales input[type=checkbox]:checked').forEach(cb=>{ const s=SERVICIOS_CATALOG.find(x=>x.id===cb.value); if(s){items.push({nombre:s.nombre,precio:s.precio_unit});subtotal+=s.precio_unit;} });
  }
  const iva=subtotal*IVA, total=subtotal+iva;
  const r=document.getElementById('cotiz-resumen');
  if (!items.length) { r.innerHTML='<div class="empty"><div class="empty-ico" style="font-size:22px;">📋</div><div class="empty-txt" style="font-size:12px;">Selecciona un paquete o servicios</div></div>'; return; }

  const itemsHtml = items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span style="color:var(--text2);">${i.nombre}</span>${i.precio?`<span style="color:var(--text);font-weight:700;">$${i.precio.toLocaleString()}</span>`:'<span style="color:var(--orange);font-size:10px;">incluido</span>'}</div>`).join('');
  r.innerHTML = nameHtml+projHtml+`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.07);">${itemsHtml}</div>`+`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:3px;"><span>Subtotal</span><span>$${subtotal.toLocaleString()}</span></div>`+`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px;"><span>IVA (16%)</span><span>$${Math.round(iva).toLocaleString()}</span></div>`+`<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:700;"><span>Total</span><span style="color:var(--orange);">$${Math.round(total).toLocaleString()}</span></div>`;

// Genera el PDF bonito y lo devuelve como base64
async function generarPDFBase64(clienteArg, proyectoArg, notasArg, fechaArg) {
  return new Promise(async (resolve) => {
    try {
      // Reusar la lógica de generarPDF pero devolver base64 en lugar de descargar
      const { jsPDF } = window.jspdf || await loadJsPDF();
      const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
      // Generar contenido simple pero con los datos correctos para Drive
      pdf.setFontSize(22);
      pdf.setTextColor(243, 146, 0);
      pdf.text('Cotización — ' + (proyectoArg||''), 20, 30);
      pdf.setFontSize(11);
      pdf.setTextColor(100,100,100);
      pdf.text('Cliente: ' + (clienteArg||''), 20, 42);
      pdf.text('Fecha: ' + new Date().toLocaleDateString('es-MX'), 20, 50);
      resolve(pdf.output('datauristring'));
    } catch(e) {
      resolve('');
    }
  });
}

async function saveCotizacionToSupabase() {
  const cliente = document.getElementById('cq-cliente')?.value.trim();
  const proyecto = document.getElementById('cq-proyecto')?.value.trim();
  if (!cliente || !proyecto) { notify('Ingresa el nombre del cliente y del proyecto.'); return false; }
  const correo = document.getElementById('cq-correo')?.value||'';
  const fecha = document.getElementById('cq-fecha')?.value||'';
  const notas = document.getElementById('cq-notas')?.value||'';
  let serviciosIds = [], subtotal = 0;
  if (cotizSeleccion.tipo==='paquete' && cotizSeleccion.paqueteId) {
    const pkg = PAQUETES.find(p=>p.id===cotizSeleccion.paqueteId);
    if (pkg) { serviciosIds=pkg.servicios; subtotal=pkg.precio_paquete; }
  } else {
    document.querySelectorAll('#cotiz-individuales input[type=checkbox]:checked').forEach(cb=>{ const s=SERVICIOS_CATALOG.find(x=>x.id===cb.value); if(s){serviciosIds.push(s.id);subtotal+=s.precio_unit;} });
  }
  const iva=Math.round(subtotal*IVA), total=subtotal+iva;
  const payload = { cliente_nombre:cliente, proyecto_nombre:proyecto, tipo:cotizSeleccion.tipo, paquete_id:cotizSeleccion.paqueteId||null, servicios_ids:serviciosIds, subtotal, iva, total, notas, fecha_entrega:fecha, creado_por: currentUser?.nombre||currentUser?.email||'equipo' };

  // Guardar en Supabase (metadatos) + Drive (PDF) via Apps Script
  try {
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsDxjjoEob5YSPjt6Eav9DKhrH2Az4WdYFsN6u1GWPnnDULOfOBK0SjXcL_Zso4xu8/exec';
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'guardarCotizacion', data: payload })
    }).catch(e => console.warn('Drive save:', e));
  } catch(e) { console.warn('Drive save:', e); }

  // También en Supabase para listar en el panel
  let res;
  if (cotizEditId) {
    res = await api('/rest/v1/cotizaciones?id=eq.'+cotizEditId, { method:'PATCH', body:JSON.stringify(payload) });
    cotizEditId = null;
  } else {
    res = await api('/rest/v1/cotizaciones', { method:'POST', body:JSON.stringify(payload) });
  }
  return true;
}

async function editarCotizacion(id) {
  const res = await api('/rest/v1/cotizaciones?id=eq.'+id+'&select=*');
  const data = await res.json();
  if (!data.length) return;
  const c = data[0];
  cotizEditId = id;
  cotizSeleccion.tipo = c.tipo||'paquete';
  cotizSeleccion.paqueteId = c.paquete_id||null;
  switchCotizTab('nueva');
  setTimeout(() => {
    document.getElementById('cq-cliente').value = c.cliente_nombre||'';
    document.getElementById('cq-proyecto').value = c.proyecto_nombre||'';
    document.getElementById('cq-correo').value = '';
    document.getElementById('cq-fecha').value = c.fecha_entrega||'';
    document.getElementById('cq-notas').value = c.notas||'';
    setCotizTipo(c.tipo||'paquete');
    if (c.paquete_id) selectPaquete(c.paquete_id);

      c.servicios_ids.forEach(sid => { const cb=document.querySelector('#cotiz-individuales input[value="'+sid+'"]'); if(cb) cb.checked=true; });

  }, 100);
}

function toggleMenu(id, btn) {
  // Close all menus first
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
  
  const menu = document.getElementById(id);
  if (!menu) return;
  
  // Position menu based on button location
  const rect = btn.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = (rect.right - menu.offsetWidth - 10) + 'px';
  menu.classList.add('active');
  
  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', function closeMenu() {
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
      document.removeEventListener('click', closeMenu);
    });
  }, 50);
}

      '<button class="modal-close" onclick="document.getElementById(\'modal-editar-cliente\').remove()">✕</button>' +
      '<div class="modal-title">Editar cliente</div>' +
      '<div class="form-grid">' +
        '<div class="fg"><label>Nombre</label><input type="text" id="ec-nombre" value="'+(cliente.nombre||'')+'"></div>' +
        '<div class="fg"><label>Empresa</label><input type="text" id="ec-empresa" value="'+(cliente.empresa||'')+'"></div>' +
        '<div class="fg"><label>Correo</label><input type="email" id="ec-correo" value="'+(cliente.correo||'')+'"></div>' +
        '<div class="fg"><label>Teléfono</label><input type="text" id="ec-tel" value="'+(cliente.telefono||'')+'"></div>' +
        '<div class="fg form-full"><label>Estado</label>' +
          '<select id="ec-estado">' +
            '<option '+(cliente.estado==='Activo'?'selected':'')+'>Activo</option>' +
            '<option '+(cliente.estado==='Pausado'?'selected':'')+'>Pausado</option>' +
            '<option '+(cliente.estado==='Completado'?'selected':'')+'>Completado</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn-cancel" onclick="document.getElementById(\'modal-editar-cliente\').remove()">Cancelar</button>' +
        '<button class="btn-save" onclick="guardarEdicionCliente(\''+cliente.id+'\')">Guardar cambios</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
}

async function guardarEdicionCliente(id) {
  const nombre = document.getElementById('ec-nombre').value.trim();
  const empresa = document.getElementById('ec-empresa').value.trim();
  const correo = document.getElementById('ec-correo').value.trim();
  const telefono = document.getElementById('ec-tel').value.trim();
  const estado = document.getElementById('ec-estado').value;

  await api('/rest/v1/clientes?id=eq.' + id, {
    method: 'PATCH',
    body: JSON.stringify({ nombre, empresa, correo, telefono, estado })
  });

  document.getElementById('modal-editar-cliente').remove();
  notify('✅ Cliente actualizado.');
  goTo('clientes');
}

async function eliminarCliente(id, nombre) {
  if (!confirm('¿Eliminar a ' + nombre + '? Esta acción no se puede deshacer.')) return;
  
  // Delete related records first
  await api('/rest/v1/archivos?cliente_id=eq.' + id, { method: 'DELETE' });
  await api('/rest/v1/proyectos?cliente_id=eq.' + id, { method: 'DELETE' });
  await api('/rest/v1/clientes?id=eq.' + id, { method: 'DELETE' });
  
  notify('✅ Cliente ' + nombre + ' eliminado.');
  goTo('clientes');
}

function autoCheckServicios(paquete) {
  const map = {
    'Nómada Esencial': ['Diseño gráfico', 'Identidad de marca'],
    'Nómada Pro': ['Identidad de marca', 'Diseño gráfico', 'Manejo de redes', 'Marketing digital'],
    'Cumbre Visual': ['Identidad de marca', 'Branding', 'Diseño gráfico', 'Fotografía', 'Manejo de redes'],
    'Expedición Total': ['Identidad de marca', 'Branding', 'Diseño gráfico', 'Fotografía', 'Manejo de redes', 'Video', 'Marketing digital', 'Estrategia', 'Sitio web'],
    'Personalizado': []
  };

  const serviciosIncluidos = map[paquete] || [];

  document.querySelectorAll('#servicios-check input[type=checkbox]').forEach(cb => {
    cb.checked = serviciosIncluidos.includes(cb.value);
    const label = cb.closest('label');
    if (label) {
      label.style.background = cb.checked ? 'rgba(243,146,0,0.08)' : 'rgba(255,255,255,0.5)';
      label.style.borderColor = cb.checked ? 'rgba(243,146,0,0.3)' : 'rgba(0,0,0,0.08)';
      label.style.color = cb.checked ? 'var(--orange)' : 'var(--text2)';
    }
  });
}

function fIco(n){
  const e=(n||'').split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp','heic'].includes(e))return'🖼';
  if(e==='pdf')return'📄';
  if(['mp4','mov','avi'].includes(e))return'🎬';
  if(['mp3','wav','m4a'].includes(e))return'🎵';
  return'📎';
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', async () => {
  const s = gs();
  // SSO: aceptar token pasado desde Nomand sin pedir login de nuevo
  const urlParams = new URLSearchParams(window.location.search);
  const ssoToken = urlParams.get('sso');
  if (ssoToken) {
    try {
      const r = await fetch(SB + '/auth/v1/user', {
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + ssoToken }
      });
      const u = await r.json();
      if (u.id) {
        ss({ access_token: ssoToken, user: u, remember: false });
        window.history.replaceState({}, '', window.location.pathname);
        initApp(u);
      }
    } catch(e) { console.warn('SSO error:', e); }
  } else if (s.access_token && s.user) {
    initApp(s.user);
  }
  document.getElementById('lpass').addEventListener('keypress', e => { if(e.key==='Enter') doLogin(); });
});
</script>
